<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>🌡️ Temperature Converter</title>

  <meta name="description"
    content="A simple temperature converter that lets you easily convert between Celsius and Fahrenheit with real-time validation and a clean modern design." />
  <meta name="keywords"
    content="temperature converter, convert celsius to fahrenheit, convert fahrenheit to celsius, temperature calculator" />

  <!-- Favicon -->
  <link rel="icon" href="./Img/favicon.ico" type="image/x-icon" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;500;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
    integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l"
    crossorigin="anonymous"
  />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./CSS/style.css" />
</head>

<body>
  <!-- ===== Main Container ===== -->
  <main class="container text-center">
    <header class="mb-4">
      <h1 class="display-5 fw-bold">
        <span id="fa" class="fa" aria-hidden="true"></span>
        Temperature Converter
      </h1>
      <p class="text-muted">Convert temperatures between Celsius and Fahrenheit instantly.</p>
    </header>

    <!-- ===== Converter Form ===== -->
    <form id="tempCalc" onsubmit="calculateTemp(); return false;" class="mx-auto shadow-sm rounded p-4">
      <div class="form-group">
        <label for="temp" class="font-weight-medium mb-2">
          Please enter the temperature you’d like to convert:
        </label>
        <input
          type="number"
          step="any"
          id="temp"
          class="form-control text-center"
          placeholder="Enter temperature value"
          required
          aria-required="true"
        />
      </div>

      <div class="form-group">
        <label for="temp_diff" class="font-weight-medium mb-2">Select Conversion Type:</label>
        <select name="temp_diff" id="temp_diff" class="form-control text-center">
          <option value="cel">° Celsius ➜ Fahrenheit</option>
          <option value="fah">° Fahrenheit ➜ Celsius</option>
        </select>
      </div>

      <button type="submit" class="btn btn-dark mt-3 px-4 py-2">
        Convert
      </button>

      <!-- Result -->
      <div id="resultContainer" class="mt-4 font-weight-bold text-dark"></div>
    </form>
  </main>

  <!-- ===== Scripts ===== -->
  <script src="./Js/script.js"></script>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/c387a6ff36.js" crossorigin="anonymous"></script>

  <!-- Bootstrap JS -->
  <script
    src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns"
    crossorigin="anonymous"
  ></script>
</body>

</html>
