<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — A Timepiece in the Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href=".\index.css">
</head>
<body>

  <main class="stage">

    <div class="watch" id="watch">
      <div class="bezel">
        <div class="bezel-notch" style="--n:0"></div>
        <div class="bezel-notch" style="--n:1"></div>
        <div class="bezel-notch" style="--n:2"></div>
        <div class="bezel-notch" style="--n:3"></div>
        <div class="bezel-notch" style="--n:4"></div>
        <div class="bezel-notch" style="--n:5"></div>
        <div class="bezel-notch" style="--n:6"></div>
        <div class="bezel-notch" style="--n:7"></div>

        <div class="dial">
          <div class="ticks" id="ticks"></div>
          <div class="numerals" id="numerals"></div>

          <p class="brand">MERIDIAN</p>
          <p class="subbrand">AUTOMATIC · WEB</p>

          <div class="hands">
            <div class="hand hour" id="hourHand"></div>
            <div class="hand minute" id="minuteHand"></div>
            <div class="hand second" id="secondHand"></div>
            <div class="pivot"></div>
          </div>

          <div class="crystal-glare"></div>
        </div>
      </div>
    </div>

    <div class="readout">
      <span class="eyebrow">Local&nbsp;Time</span>
      <span class="digital" id="digitalTime">00:00:00</span>
      <span class="date" id="digitalDate">—</span>
    </div>

  </main>

  <script src="./index.js"></script>
</body>
</html>
