<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Clock with Custom Start</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div style="text-align:center; margin-bottom:20px;">
    <label for="timeInput">Enter Start Time (e.g., 1 PM or 4 AM): </label>
    <input type="text" id="timeInput" placeholder="1 PM">
    <button id="startBtn">Start Clock</button>
  </div>

  <div id="clockContainer">
    <div id="hour"></div>
    <div id="minute"></div>
    <div id="second"></div>
    <div id="center"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
